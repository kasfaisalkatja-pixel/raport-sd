    // =========================================================================

    function sbCheck(res) {
      if (res && res.error) throw new Error(res.error.message || 'Terjadi kesalahan pada database Supabase.');
      return res;
    }

    function tahunMatch(row) {
      if (!row || !row.tahun_ajaran || !state.sekolah?.tahun_ajaran) return true;
      return String(row.tahun_ajaran).trim() === String(state.sekolah.tahun_ajaran).trim();
    }

    function formatExcelDate(val) {
      if (val === null || val === undefined || val === '') return '';
      if (typeof val === 'number' && val > 20000 && val < 80000) {
        const utcDays = Math.floor(val - 25569);
        const dt = new Date(utcDays * 86400 * 1000);
        if (!isNaN(dt.getTime())) {
          return dt.toISOString().slice(0, 10);
        }
      }
      return String(val).trim();
    }

    async function syncAllDataFromSupabase() {
      if (IS_PREVIEW || !supabase) return;
      try {
        const [
          resSekolah, resKelas, resGuru, resMapel, resSiswa,
          resTp, resNilai, resP3, resEkskul, resWali
        ] = await Promise.all([
          supabase.from('sekolah_config').select('*').limit(1),
          supabase.from('kelas').select('*').order('tingkat', { ascending: true }),
          supabase.from('guru_users').select('*').order('nama_lengkap', { ascending: true }),
          supabase.from('mapel').select('*').order('urutan', { ascending: true }),
          supabase.from('siswa').select('*').order('nama_siswa', { ascending: true }),
          supabase.from('tujuan_pembelajaran').select('*').order('tingkat', { ascending: true }),
          supabase.from('nilai_rapor').select('*'),
          supabase.from('nilai_karakter_p3').select('*'),
          supabase.from('nilai_ekskul').select('*'),
          supabase.from('data_wali_kelas').select('*')
        ]);

        [resSekolah, resKelas, resGuru, resMapel, resSiswa, resTp, resNilai, resP3, resEkskul, resWali].forEach(sbCheck);

        if (resSekolah.data && resSekolah.data.length > 0) state.sekolah = resSekolah.data[0];
        state.kelasList = resKelas.data || [];
        state.guruList = resGuru.data || [];
        state.mapelList = resMapel.data || [];
        state.siswaList = resSiswa.data || [];
        state.tpList = resTp.data || [];
        state.nilaiRaporList = resNilai.data || [];
        state.nilaiP3List = resP3.data || [];
        state.nilaiEkskulList = resEkskul.data || [];
        state.dataWaliList = resWali.data || [];

        if (!state.selectedKelasId || !state.kelasList.some(k => k.id === state.selectedKelasId)) {
          if (state.currentUser?.wali_kelas_id && state.kelasList.some(k => k.id === state.currentUser.wali_kelas_id)) {
            state.selectedKelasId = state.currentUser.wali_kelas_id;
          } else {
            state.selectedKelasId = state.kelasList[0]?.id || '';
          }
        }
        if (!state.selectedMapelId || !state.mapelList.some(m => m.id === state.selectedMapelId)) {
          state.selectedMapelId = state.mapelList[0]?.id || '';
        }
      } catch (err) {
        showToast('Gagal menyinkronkan data dari cloud: ' + err.message, 'error');
      }
    }

    // =========================================================================

    // =========================================================================
    function showToast(message, type = 'success') {
      const existing = document.getElementById('erapor-toast');
      if (existing) existing.remove();

      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-400',
        error: 'bg-rose-600 text-white border-rose-400',
        info: 'bg-blue-700 text-white border-blue-400'
      };

      const toast = document.createElement('div');
      toast.id = 'erapor-toast';
      toast.className = `fixed top-5 right-5 z-[9999999] px-4 py-3 rounded-2xl shadow-xl border text-xs sm:text-sm font-semibold flex items-center gap-2.5 transition-all duration-300 ${colors[type] || colors.info}`;
      const span = document.createElement('span');
      span.textContent = String(message ?? '');
      toast.appendChild(span);
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3400);
    }

    function openModal(title, bodyHtml, maxWidthClass = 'max-w-2xl') {
      closeModal();
      const overlay = document.createElement('div');
      overlay.id = 'erapor-modal-overlay';
      overlay.className = 'fixed inset-0 z-[9999995] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto';
      overlay.innerHTML = `
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden my-auto animate-fadeIn">
          <div class="bg-gradient-to-r from-blue-900 via-blue-700 to-sky-600 px-5 py-3.5 flex items-center justify-between text-white">
            <h3 class="font-bold text-sm sm:text-base">${esc(title)}</h3>
            <button type="button" id="close-modal-btn" class="p-1 rounded-lg hover:bg-white/20 transition">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <div class="p-5 max-h-[82vh] overflow-y-auto">${bodyHtml}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      if (window.lucide) window.lucide.createIcons();
      document.getElementById('close-modal-btn').onclick = closeModal;
      overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    }

    function confirmAction(title, message, onConfirm, confirmLabel = 'Ya, Hapus') {
      openModal(title, `
        <div class="space-y-4 text-xs sm:text-sm text-slate-700">
          <p class="leading-relaxed">${esc(message)}</p>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
            <button type="button" id="btn-confirm-cancel" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-xs">Batal</button>
            <button type="button" id="btn-confirm-ok" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">${esc(confirmLabel)}</button>
          </div>
        </div>
      `, 'max-w-md');
      document.getElementById('btn-confirm-cancel').onclick = closeModal;
      document.getElementById('btn-confirm-ok').onclick = async () => {
        const okBtn = document.getElementById('btn-confirm-ok');
        okBtn.disabled = true;
        okBtn.textContent = 'Memproses...';
        try {
          await onConfirm();
        } finally {
          closeModal();
        }
      };
    }

    function closeModal() {
      const m = document.getElementById('erapor-modal-overlay');
      if (m) m.remove();
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

      registerForm.onsubmit = async (e) => {
        e.preventDefault();
        const btnReg = document.getElementById('btn-submit-register-guru');
        const nama = document.getElementById('reg-nama').value.trim();
        const nip = document.getElementById('reg-nip').value.trim();

        const password = document.getElementById('reg-password').value;

        // Simpan NIP (jika ada & bukan '-') sebagai username utama, atau gunakan nama
        const cleanNip = (nip && nip !== '-') ? nip : '';
        const usernameVal = cleanNip || nama;
        // Simpan nama sekolah & jabatan terstruktur agar tetap tampil di perangkat mana pun tanpa perlu ubah skema SQL
        const roleCombined = `${jabatan} | ${namaSekolah}`;

        btnReg.disabled = true;
        btnReg.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span><span>Mendaftarkan Akun...</span>`;

              nama_lengkap: nama,

              wali_kelas_id: null
            });
          } else {
            // Cek apakah NIP/Nama sudah terdaftar sebelumnya (aman dari karakter khusus)
            const [byUser, byNama] = await Promise.all([
              supabase.from('guru_users').select('id').eq('username', usernameVal).limit(1),
              supabase.from('guru_users').select('id').ilike('nama_lengkap', nama).limit(1)
            ]);
            sbCheck(byUser);
            sbCheck(byNama);

            if ((byUser.data && byUser.data.length > 0) || (byNama.data && byNama.data.length > 0)) {
              throw new Error('Akun dengan Nama atau NIP tersebut sudah terdaftar. Silakan langsung masuk di tab Masuk Guru.');

            const { error } = await supabase.from('guru_users').insert([{
              username: usernameVal,
              password,
              nama_lengkap: nama,
              nip: nip || '-',
              role: roleCombined,
              wali_kelas_id: null
            }]);
            if (error) throw error;

            // Perbarui nama sekolah di konfigurasi sekolah jika masih default
            const { data: sekData } = await supabase.from('sekolah_config').select('*').limit(1);
            if (sekData && sekData.length > 0 && sekData[0].nama_sekolah === 'SD NEGERI 1 CONTOH') {
              await supabase.from('sekolah_config').update({ nama_sekolah: namaSekolah }).eq('id', sekData[0].id);
            }
          }

          showToast('Pendaftaran berhasil! Silakan masuk menggunakan Nama atau NIP dan Password Anda.', 'success');
          registerForm.reset();
          switchToGuruLogin();
          userInput.value = cleanNip || nama;
          document.getElementById('login-password').value = password;
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          btnReg.disabled = false;
          btnReg.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i><span>Daftar & Simpan Akun Guru</span>`;
          if (window.lucide) window.lucide.createIcons();

        e.preventDefault();
        const roleType = roleInput.value;
        const identifier = userInput.value.trim();

        const semester = document.getElementById('login-semester').value;
        await handleLoginProcess(roleType, identifier, password, semester);
      };
    }

    function parseGuruRoleAndSchool(rawRole, defaultSchool) {
      if (!rawRole) return { jabatan: 'Guru Kelas', namaSekolah: defaultSchool };
      if (rawRole.includes(' | ')) {
        const parts = rawRole.split(' | ');
        return { jabatan: parts[0].trim(), namaSekolah: parts[1].trim() || defaultSchool };
      }
      return { jabatan: rawRole, namaSekolah: defaultSchool };
    }

    async function handleLoginProcess(roleType, identifier, password, semester) {
      const btn = document.getElementById('btn-submit-login');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span><span>Memverifikasi Akun...</span>`;
      }

      try {
        state.selectedSemester = semester;

        if (IS_PREVIEW) {
          initPreviewDummyData();
          if (roleType === 'admin') {
            state.currentUser = {
              id: 'admin-preview',
              roleType: 'admin',
              nama: 'Operator SD Negeri 1 Contoh',
              nip: '198501012010011001',
              username: identifier || 'admin@sdn1contoh.sch.id',
              jabatan: 'Administrator Sekolah',
              wali_kelas_id: state.kelasList[0]?.id || ''
            };
          } else {
            const q = identifier.toLowerCase();
            const foundGuru = state.guruList.find(g =>
              g.password === password && (
                g.nama_lengkap.toLowerCase() === q ||
                (g.nip && g.nip.toLowerCase() === q) ||
                g.username.toLowerCase() === q
              )
            );
            if (!foundGuru) throw new Error('Nama / NIP atau Password tidak cocok.');
            const parsed = parseGuruRoleAndSchool(foundGuru.role, state.sekolah.nama_sekolah);
            state.sekolah.nama_sekolah = parsed.namaSekolah;
            state.currentUser = {
              id: foundGuru.id,
              roleType: 'guru',
              nama: foundGuru.nama_lengkap,
              nip: foundGuru.nip,
              username: foundGuru.username,
              jabatan: parsed.jabatan,
              wali_kelas_id: foundGuru.wali_kelas_id
            };
          }
          showToast(`Selamat datang, ${state.currentUser.nama}!`, 'success');
          renderMainShell();
          return;
        }

        // MODE PRODUKSI (100% TERHUBUNG KE SUPABASE)
        if (roleType === 'admin') {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: identifier,
            password: password
          });
          if (error) throw new Error('Email atau password Admin salah: ' + error.message);

          state.currentUser = {
            id: data.user.id,
            roleType: 'admin',
            nama: 'Administrator Sekolah',
            nip: '-',
            username: data.user.email,
            jabatan: 'Admin / Operator Dapodik',
            wali_kelas_id: ''
          };
          localStorage.setItem('erapor_sd_session', JSON.stringify({ roleType: 'admin', semester }));
        } else {
          // Login Guru / Wali Kelas menggunakan Nama Lengkap ATAU NIP + Password
          const { data: gurus, error } = await supabase
            .from('guru_users')
            .select('*')
            .eq('password', password);

          if (error) throw new Error('Gagal memeriksa akun guru: ' + error.message);

          const q = identifier.toLowerCase();
          const matched = (gurus || []).find(g =>
            (g.nama_lengkap && g.nama_lengkap.trim().toLowerCase() === q) ||
            (g.nip && g.nip !== '-' && g.nip.trim().toLowerCase() === q) ||
            (g.username && g.username.trim().toLowerCase() === q)
          );

          if (!matched) {
            throw new Error('Nama Lengkap / NIP atau Password tidak ditemukan. Silakan periksa kembali atau klik tab "Daftar Guru".');
          }

          await syncAllDataFromSupabase();
          const parsed = parseGuruRoleAndSchool(matched.role, state.sekolah.nama_sekolah);
          state.sekolah.nama_sekolah = parsed.namaSekolah;

          state.currentUser = {
            id: matched.id,
            roleType: 'guru',
            nama: matched.nama_lengkap,
            nip: matched.nip || '-',
            username: matched.username,
            jabatan: parsed.jabatan,
            wali_kelas_id: matched.wali_kelas_id || ''
          };
          localStorage.setItem('erapor_sd_session', JSON.stringify({ roleType: 'guru', guruId: matched.id, semester }));
          showToast(`Berhasil masuk sebagai ${state.currentUser.nama}`, 'success');
          renderMainShell();
          return;
        }

        await syncAllDataFromSupabase();
        showToast(`Berhasil masuk sebagai ${state.currentUser.nama}`, 'success');
        renderMainShell();
      } catch (err) {
        showToast(err.message, 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Masuk Aplikasi</span>`;
          if (window.lucide) window.lucide.createIcons();
        }
      }
    }

    async function handleLogout() {
      if (!IS_PREVIEW && supabase && state.currentUser?.roleType === 'admin') {
        await supabase.auth.signOut();
      }
      localStorage.removeItem('erapor_sd_session');
      state.currentUser = null;
      showToast('Anda telah keluar dari aplikasi.', 'info');
      renderLoginScreen();
    }

          </div>

      // Bind Navigasi
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          state.activeMenu = btn.getAttribute('data-nav');
          renderMainShell();
        };
      });

      const toggleSub = document.getElementById('toggle-nilai-submenu');
      if (toggleSub) {
        toggleSub.onclick = () => {
          state.nilaiSubOpen = !state.nilaiSubOpen;
          renderMainShell();
        };
      }

      document.getElementById('header-semester-sel').onchange = (e) => {
        state.selectedSemester = e.target.value;
        try {
          const savedRaw = localStorage.getItem('erapor_sd_session');
          if (savedRaw) {
            const saved = JSON.parse(savedRaw);
            saved.semester = state.selectedSemester;
            localStorage.setItem('erapor_sd_session', JSON.stringify(saved));

        renderMainShell();
      };

        const btn = document.getElementById('btn-sync-cloud-top');

        renderMainShell();

    // =========================================================================
    // ROUTER HALAMAN KONTEN
    // =========================================================================
    function renderActivePage() {
      const container = document.getElementById('main-content-container');
      if (!container) return;

      switch (state.activeMenu) {
        case 'dashboard': renderDashboardPage(container); break;
        case 'data-siswa': renderDataSiswaPage(container); break;
        case 'tujuan-pembelajaran': renderTPPage(container); break;
        case 'input-nilai': renderInputNilaiPage(container); break;
        case 'import-nilai': renderImportNilaiPage(container); break;
        case 'cek-penilaian': renderCekPenilaianPage(container); break;
        case 'nilai-karakter': renderNilaiKarakterPage(container); break;
        case 'ekstrakurikuler': renderEkskulPage(container); break;
        case 'data-walas': renderDataWalasPage(container); break;
        case 'cetak-rapor': renderCetakRaporPage(container); break;
        case 'pengaturan': renderPengaturanPage(container); break;
        default: renderDashboardPage(container);
      }
    }

    function renderDataSiswaPage(container) {

        document.querySelectorAll('.siswa-row').forEach(row => {

        const klsObj = state.kelasList.find(k => k.id === kelasFilter);
        const rows = siswaFiltered.map((s, i) => ({
          'No': i + 1,
          'Nama Lengkap Siswa': s.nama_siswa,
          'NIS': s.nis,
          'NISN': s.nisn,
          'JK (L/P)': s.jk,
          'Tempat Lahir': s.tempat_lahir || '',
          'Tanggal Lahir (YYYY-MM-DD)': s.tanggal_lahir || '',
          'Agama': s.agama || 'Islam',
          'Alamat': s.alamat_siswa || ''
        }));
        exportStyledExcel(
          rows.length > 0 ? rows : [{ 'No': 1, 'Nama Lengkap Siswa': '', 'NIS': '', 'NISN': '', 'JK (L/P)': 'L', 'Tempat Lahir': '', 'Tanggal Lahir (YYYY-MM-DD)': '', 'Agama': 'Islam', 'Alamat': '' }],

        );

      document.querySelectorAll('.btn-edit-siswa').forEach(btn => {
        btn.onclick = () => {
          const siswa = state.siswaList.find(s => s.id === btn.getAttribute('data-edit-siswa'));
          if (siswa) openSiswaFormModal(siswa, kelasFilter, container);
        };
      });

      document.querySelectorAll('.btn-del-siswa').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-del-siswa');
          const sObj = state.siswaList.find(s => s.id === id);
          confirmAction(
            'Hapus Data Siswa',
            `Yakin ingin menghapus siswa "${sObj?.nama_siswa || 'ini'}"? Data nilai terkait mungkin tidak akan tampil lagi.`,
            async () => {
              try {
                if (IS_PREVIEW) {
                  state.siswaList = state.siswaList.filter(s => s.id !== id);
                } else {
                  sbCheck(await supabase.from('siswa').delete().eq('id', id));
                  await syncAllDataFromSupabase();
                }
                showToast('Data siswa berhasil dihapus.', 'info');
                renderDataSiswaPage(container);
                if (window.lucide) window.lucide.createIcons();
              } catch (err) {
                showToast('Gagal menghapus siswa: ' + err.message, 'error');
              }
            }
          );
        };
      });

      document.querySelectorAll('.btn-detail-siswa').forEach(btn => {
        btn.onclick = () => {
          const s = state.siswaList.find(item => item.id === btn.getAttribute('data-detail-siswa'));

          const kls = state.kelasList.find(k => k.id === s.kelas_id);
          openModal('Detail Data Siswa SD', `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400 block">Nama Lengkap</span><strong class="text-slate-800 text-sm">${esc(s.nama_siswa)}</strong></div>
              <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400 block">Kelas / Rombel</span><strong class="text-blue-700">${esc(kls?.nama_kelas || '-')}</strong></div>
              <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400 block">NIS / NISN</span><strong class="text-slate-800">${esc(s.nis)} / ${esc(s.nisn)}</strong></div>
              <div class="p-3 bg-slate-50 rounded-xl"><span class="text-slate-400 block">Jenis Kelamin / Agama</span><strong class="text-slate-800">${s.jk === 'L' ? 'Laki-laki' : 'Perempuan'} / ${esc(s.agama || '-')}</strong></div>
              <div class="p-3 bg-slate-50 rounded-xl sm:col-span-2"><span class="text-slate-400 block">Tempat, Tanggal Lahir</span><strong class="text-slate-800">${esc(s.tempat_lahir || '-')}, ${esc(s.tanggal_lahir || '-')}</strong></div>
              <div class="p-3 bg-slate-50 rounded-xl sm:col-span-2"><span class="text-slate-400 block">Alamat Siswa</span><strong class="text-slate-800">${esc(s.alamat_siswa || '-')}</strong></div>
            </div>
          `, 'max-w-lg');
        };
      });
    }

    function openImportSiswaExcelModal(defaultKelasId, parentContainer) {
      if (state.kelasList.length === 0) {
        showToast('Silakan buat Kelas / Rombel terlebih dahulu di menu Pengaturan & Akun.', 'error');
        return;
      }
      const klsObj = state.kelasList.find(k => k.id === defaultKelasId) || state.kelasList[0];
      openModal('Import Data Siswa dari Excel (.xlsx / .csv)', `
        <div class="space-y-4 text-xs">
          <div class="bg-blue-50 border border-blue-200 rounded-xl p-3.5 text-blue-900 space-y-2">
            <p class="font-bold">Langkah Mudah Import Data Siswa:</p>
            <ol class="list-decimal ml-4 space-y-1">
              <li>Unduh format template Excel di bawah ini (sudah tertata rapi tanpa kolom data pelengkap).</li>
              <li>Isi daftar siswa pada file Excel tersebut (kolom wajib: <strong>Nama Lengkap Siswa, NIS, NISN, JK</strong>).</li>
              <li>Pilih file Excel yang sudah diisi, lalu klik <strong>Proses Import Siswa</strong>.</li>
            </ol>
            <div class="pt-1">
              <button type="button" id="btn-dl-template-siswa" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl font-bold inline-flex items-center gap-1.5 shadow-sm transition">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Download Template Excel Siswa (.xlsx)</span>
              </button>
            </div>
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Masukkan ke Kelas / Rombel *</label>
            <select id="import-siswa-kelas-target" class="w-full border border-slate-300 rounded-xl px-3 py-2 font-bold">
              ${state.kelasList.map(k => `<option value="${k.id}" ${k.id === klsObj.id ? 'selected' : ''}>${esc(k.nama_kelas)}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Pilih File Excel (.xlsx, .xls, atau .csv) *</label>
            <input type="file" id="input-file-siswa-excel" accept=".xlsx,.xls,.csv" class="block w-full text-xs text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border border-slate-300 rounded-xl p-1.5" />
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
            <button type="button" onclick="document.getElementById('close-modal-btn').click()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Batal</button>
            <button type="button" id="btn-proses-import-siswa" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm flex items-center gap-1.5">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>Proses Import Siswa</span>
            </button>
          </div>
        </div>
      `, 'max-w-lg');

      document.getElementById('btn-dl-template-siswa').onclick = () => {
        const sampleRows = [
          {
            'No': 1,
            'Nama Lengkap Siswa': 'CONTOH NAMA SISWA',
            'NIS': '2026001',
            'NISN': '0151234567',
            'JK (L/P)': 'L',
            'Tempat Lahir': 'Kendari',
            'Tanggal Lahir (YYYY-MM-DD)': '2015-05-10',
            'Agama': 'Islam',
            'Alamat': 'Jl. Pendidikan No. 1'
          }
        ];
        exportStyledExcel(
          sampleRows,
          `Template_Import_Siswa_${klsObj?.nama_kelas || 'SD'}.xlsx`,
          'Format Import Siswa',
          [6, 32, 14, 16, 10, 18, 24, 14, 34]
        );
        showToast('Template Excel siswa yang rapi berhasil diunduh!', 'success');
      };

      document.getElementById('btn-proses-import-siswa').onclick = () => {
        const fileEl = document.getElementById('input-file-siswa-excel');
        const targetKelasId = document.getElementById('import-siswa-kelas-target').value;
        if (!fileEl.files || fileEl.files.length === 0) {
          showToast('Silakan pilih file Excel terlebih dahulu!', 'error');
          return;
        }
        if (!window.XLSX) {
          showToast('Library pembaca Excel sedang dimuat, coba sesaat lagi.', 'info');
          return;
        }

        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = new Uint8Array(ev.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });

            const newStudents = [];
            for (const row of rows) {
              const namaRaw = String(row['Nama Lengkap Siswa'] || row['NAMA_SISWA'] || row['Nama Siswa'] || row['Nama'] || '').trim();
              if (!namaRaw || namaRaw.toUpperCase() === 'CONTOH NAMA SISWA') continue;

              const jkRaw = String(row['JK (L/P)'] || row['JK'] || 'L').trim().toUpperCase();
              const jkClean = jkRaw.startsWith('P') ? 'P' : 'L';

              newStudents.push({
                nama_siswa: namaRaw.toUpperCase(),
                nis: String(row['NIS'] || '').trim() || '-',
                nisn: String(row['NISN'] || '').trim() || '-',
                jk: jkClean,
                tempat_lahir: String(row['Tempat Lahir'] || '').trim(),
                tanggal_lahir: formatExcelDate(row['Tanggal Lahir (YYYY-MM-DD)'] || row['Tanggal Lahir'] || ''),
                agama: String(row['Agama'] || 'Islam').trim() || 'Islam',
                alamat_siswa: String(row['Alamat'] || row['Alamat Siswa'] || '').trim(),
                kelas_id: targetKelasId
              });
            }

            if (newStudents.length === 0) {
              showToast('Tidak ada baris data siswa yang valid di dalam file Excel.', 'error');
              return;
            }

            if (IS_PREVIEW) {
              newStudents.forEach((st, idx) => {
                state.siswaList.push({ id: 's-' + Date.now() + '-' + idx, ...st });
              });
            } else {
              const { error } = await supabase.from('siswa').insert(newStudents);
              if (error) throw error;
              await syncAllDataFromSupabase();
            }

            state.selectedKelasId = targetKelasId;
            closeModal();
            showToast(`Berhasil mengimport ${newStudents.length} data siswa dari Excel!`, 'success');
            renderDataSiswaPage(parentContainer);
            if (window.lucide) window.lucide.createIcons();
          } catch (err) {
            showToast('Gagal membaca file Excel: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(fileEl.files[0]);
      };
    }

    function openSiswaFormModal(siswaObj, defaultKelasId, parentContainer) {

        showToast('Silakan buat Kelas / Rombel terlebih dahulu di menu Pengaturan & Akun.', 'error');
        return;

      const isEdit = Boolean(siswaObj);
      const s = siswaObj || {
        nis: '', nisn: '', nama_siswa: '', jk: 'L', tempat_lahir: '', tanggal_lahir: '',
        agama: 'Islam', kelas_id: defaultKelasId || state.kelasList[0].id, alamat_siswa: ''
      };

      openModal(isEdit ? 'Edit Data Siswa SD' : 'Tambah Siswa SD Baru', `

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Nama Lengkap Siswa *</label>

            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Kelas / Rombel *</label>

              </select>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">NIS *</label>
              <input type="text" name="nis" required value="${esc(s.nis)}" placeholder="Nomor Induk Siswa" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">NISN *</label>
              <input type="text" name="nisn" required value="${esc(s.nisn)}" placeholder="Nomor Induk Siswa Nasional" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Tempat Lahir</label>
              <input type="text" name="tempat_lahir" value="${esc(s.tempat_lahir)}" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Tanggal Lahir</label>
              <input type="date" name="tanggal_lahir" value="${esc(s.tanggal_lahir)}" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Jenis Kelamin</label>
              <select name="jk" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                <option value="L" ${s.jk === 'L' ? 'selected' : ''}>Laki-laki (L)</option>
                <option value="P" ${s.jk === 'P' ? 'selected' : ''}>Perempuan (P)</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Agama</label>
              <select name="agama" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                ${['Islam', 'Kristen', 'Katolik', 'Hindu', 'Buddha', 'Konghucu'].map(ag => `<option value="${ag}" ${s.agama === ag ? 'selected' : ''}>${ag}</option>`).join('')}
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="font-bold text-slate-700 block mb-1">Alamat Siswa</label>
              <input type="text" name="alamat_siswa" value="${esc(s.alamat_siswa)}" placeholder="Alamat tempat tinggal siswa" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
            </div>
          </div>

          <div class="pt-3 flex justify-end gap-2 border-t border-slate-200">
            <button type="button" onclick="document.getElementById('close-modal-btn').click()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm">Simpan Data Siswa</button>
          </div>
        </form>
      `, 'max-w-xl');

      document.getElementById('form-siswa-modal').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());
        payload.nama_siswa = payload.nama_siswa.toUpperCase();

        try {
          if (IS_PREVIEW) {
            if (isEdit) {
              const idx = state.siswaList.findIndex(item => item.id === s.id);
              state.siswaList[idx] = { ...s, ...payload };
            } else {
              state.siswaList.push({ id: 's-' + Date.now(), ...payload });
            }
          } else {
            if (isEdit) {
              const { error } = await supabase.from('siswa').update(payload).eq('id', s.id);
              if (error) throw error;
            } else {
              const { error } = await supabase.from('siswa').insert([payload]);
              if (error) throw error;
            }
            await syncAllDataFromSupabase();
          }
          closeModal();
          showToast('Data siswa berhasil disimpan!', 'success');
          renderDataSiswaPage(parentContainer);
          if (window.lucide) window.lucide.createIcons();
        } catch (err) {
          showToast('Gagal menyimpan data siswa: ' + err.message, 'error');
        }
      };
    }

    // =========================================================================
    // 3. HALAMAN TUJUAN PEMBELAJARAN (TP)
    // =========================================================================
    function renderTPPage(container) {
      const mapelId = state.selectedMapelId || (state.mapelList[0]?.id || '');
      const klsObj = state.kelasList.find(k => k.id === state.selectedKelasId) || state.kelasList[0];
      const tingkatFilter = klsObj ? Number(klsObj.tingkat) : 6;
      const tpFiltered = state.tpList.filter(tp => tp.mapel_id === mapelId && Number(tp.tingkat) === tingkatFilter && String(tp.semester) === String(state.selectedSemester));

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-lg font-extrabold text-slate-800">Input Tujuan Pembelajaran (TP)</h2>
              <p class="text-xs text-slate-500">Memuat Kompetensi + Lingkup Materi (diawali huruf kecil, maks. 100 karakter).</p>
            </div>
            <button type="button" id="btn-tambah-tp" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>+ Tambah Tujuan Pembelajaran</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 text-xs">
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Mata Pelajaran</label>
              <select id="tp-mapel-select" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                ${state.mapelList.map(m => `<option value="${m.id}" ${m.id === mapelId ? 'selected' : ''}>${esc(m.nama_mapel)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Tingkat Kelas SD</label>
              <select id="tp-tingkat-select" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                ${[1, 2, 3, 4, 5, 6].map(t => `<option value="${t}" ${t === tingkatFilter ? 'selected' : ''}>Kelas ${t} SD</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Semester</label>
              <select id="tp-semester-select" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                <option value="1" ${state.selectedSemester === '1' ? 'selected' : ''}>Semester 1 (Ganjil)</option>
                <option value="2" ${state.selectedSemester === '2' ? 'selected' : ''}>Semester 2 (Genap)</option>
              </select>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-blue-600 text-white">
                  <th class="py-3 px-3 font-bold w-12">No</th>
                  <th class="py-3 px-3 font-bold w-20 text-center">Tingkat</th>
                  <th class="py-3 px-3 font-bold w-20 text-center">Semester</th>
                  <th class="py-3 px-3 font-bold">Tujuan Pembelajaran (Maksimal 100 Karakter)</th>
                  <th class="py-3 px-3 font-bold w-24 text-center">Status</th>
                  <th class="py-3 px-3 font-bold w-20 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${tpFiltered.length === 0 ? `
                  <tr><td colspan="6" class="py-8 text-center text-slate-400">Belum ada Tujuan Pembelajaran untuk pilihan ini. Klik <strong>+ Tambah Tujuan Pembelajaran</strong>.</td></tr>
                ` : tpFiltered.map((tp, i) => `
                  <tr class="hover:bg-slate-50">
                    <td class="py-2.5 px-3 font-bold text-slate-500">${i + 1}</td>
                    <td class="py-2.5 px-3 text-center"><span class="bg-slate-100 border border-slate-300 px-2.5 py-1 rounded-lg font-bold">${tp.tingkat}</span></td>
                    <td class="py-2.5 px-3 text-center"><span class="bg-slate-100 border border-slate-300 px-2.5 py-1 rounded-lg font-bold">${tp.semester}</span></td>
                    <td class="py-2.5 px-3">
                      <input type="text" maxlength="100" data-tp-id="${tp.id}" value="${esc(tp.deskripsi_tp)}" class="tp-inline-input w-full border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </td>
                    <td class="py-2.5 px-3 text-center">
                      <button type="button" data-toggle-tp="${tp.id}" class="btn-toggle-tp px-2.5 py-1 rounded-lg font-bold text-[11px] ${tp.status === 'Aktif' ? 'bg-emerald-100 text-emerald-700 border border-emerald-300' : 'bg-slate-200 text-slate-600'}">
                        ${esc(tp.status)}
                      </button>
                    </td>
                    <td class="py-2.5 px-3 text-center">
                      <button type="button" data-del-tp="${tp.id}" class="btn-del-tp text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          ${tpFiltered.length > 0 ? `
            <div class="flex justify-end">
              <button type="button" id="btn-simpan-perubahan-tp" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm transition">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Simpan Perubahan TP</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('tp-mapel-select').onchange = (e) => {
        state.selectedMapelId = e.target.value;
        renderTPPage(container);
        if (window.lucide) window.lucide.createIcons();
      };

      document.getElementById('tp-tingkat-select').onchange = (e) => {
        const t = Number(e.target.value);
        const matchKls = state.kelasList.find(k => Number(k.tingkat) === t);
        if (matchKls) state.selectedKelasId = matchKls.id;
        renderTPPage(container);
        if (window.lucide) window.lucide.createIcons();
      };

      document.getElementById('tp-semester-select').onchange = (e) => {
        state.selectedSemester = e.target.value;
        renderTPPage(container);
        if (window.lucide) window.lucide.createIcons();
      };

      document.getElementById('btn-tambah-tp').onclick = () => {
        openModal('Tambah Tujuan Pembelajaran (TP)', `
          <form id="form-add-tp" class="space-y-4 text-xs">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="font-bold text-slate-700 block mb-1">Mata Pelajaran</label>
                <select name="mapel_id" class="w-full border border-slate-300 rounded-xl px-3 py-2 font-bold">
                  ${state.mapelList.map(m => `<option value="${m.id}" ${m.id === mapelId ? 'selected' : ''}>${esc(m.nama_mapel)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-1">Tingkat Kelas SD</label>
                <select name="tingkat" class="w-full border border-slate-300 rounded-xl px-3 py-2 font-bold">
                  ${[1, 2, 3, 4, 5, 6].map(t => `<option value="${t}" ${t === tingkatFilter ? 'selected' : ''}>Kelas ${t}</option>`).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Deskripsi Tujuan Pembelajaran (1 baris = 1 TP, maks 100 karakter/baris)</label>
              <textarea name="tp_lines" rows="4" required placeholder="Contoh:&#10;memahami makna simbol-simbol Pancasila dalam kehidupan sehari-hari&#10;menerapkan aturan yang berlaku di rumah dan sekolah" class="w-full border border-slate-300 rounded-xl p-3 text-xs leading-relaxed"></textarea>
              <p class="text-[11px] text-slate-500 mt-1">Catatan: Diawali huruf kecil tanpa tanda titik di akhir agar otomatis menyatu pada kalimat deskripsi rapor.</p>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
              <button type="button" onclick="document.getElementById('close-modal-btn').click()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white font-bold">Proses & Simpan TP</button>
            </div>
          </form>
        `, 'max-w-lg');

        document.getElementById('form-add-tp').onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const mId = fd.get('mapel_id');
          const tgk = Number(fd.get('tingkat'));
          const lines = fd.get('tp_lines').split('\n').map(l => l.trim().slice(0, 100)).filter(Boolean);
          if (lines.length === 0) return;

          const newRecords = lines.map(desc => ({
            mapel_id: mId,
            tingkat: tgk,
            semester: String(state.selectedSemester),
            deskripsi_tp: desc,
            status: 'Aktif'
          }));

          try {
            if (IS_PREVIEW) {
              newRecords.forEach((rec, i) => state.tpList.push({ id: 'tp-' + Date.now() + i, ...rec }));
            } else {
              const { error } = await supabase.from('tujuan_pembelajaran').insert(newRecords);
              if (error) throw error;
              await syncAllDataFromSupabase();
            }
            closeModal();
            showToast(`${newRecords.length} Tujuan Pembelajaran berhasil ditambahkan!`, 'success');
            renderTPPage(container);
            if (window.lucide) window.lucide.createIcons();
          } catch (err) {
            showToast('Gagal menyimpan TP: ' + err.message, 'error');
          }
        };
      };

      const btnSaveEdit = document.getElementById('btn-simpan-perubahan-tp');
      if (btnSaveEdit) {
        btnSaveEdit.onclick = async () => {
          const inputs = document.querySelectorAll('.tp-inline-input');
          btnSaveEdit.disabled = true;
          try {
            for (const inp of inputs) {
              const id = inp.getAttribute('data-tp-id');
              const val = inp.value.trim();
              if (IS_PREVIEW) {
                const idx = state.tpList.findIndex(t => t.id === id);
                if (idx >= 0) state.tpList[idx].deskripsi_tp = val;
              } else {
                sbCheck(await supabase.from('tujuan_pembelajaran').update({ deskripsi_tp: val }).eq('id', id));
              }
            }
            if (!IS_PREVIEW) await syncAllDataFromSupabase();
            showToast('Perubahan Tujuan Pembelajaran berhasil disimpan!', 'success');
          } catch (err) {
            showToast('Gagal menyimpan perubahan TP: ' + err.message, 'error');
          } finally {
            btnSaveEdit.disabled = false;
          }
        };
      }

      document.querySelectorAll('.btn-toggle-tp').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-toggle-tp');
          const item = state.tpList.find(t => t.id === id);
          if (!item) return;
          const nextStatus = item.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
          try {
            if (IS_PREVIEW) {
              item.status = nextStatus;
            } else {
              sbCheck(await supabase.from('tujuan_pembelajaran').update({ status: nextStatus }).eq('id', id));
              await syncAllDataFromSupabase();
            }
            renderTPPage(container);
            if (window.lucide) window.lucide.createIcons();
          } catch (err) {
            showToast('Gagal mengubah status TP: ' + err.message, 'error');
          }
        };
      });

      document.querySelectorAll('.btn-del-tp').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-del-tp');
          confirmAction(
            'Hapus Tujuan Pembelajaran',
            'Yakin ingin menghapus Tujuan Pembelajaran ini?',
            async () => {
              try {
                if (IS_PREVIEW) {
                  state.tpList = state.tpList.filter(t => t.id !== id);
                } else {
                  sbCheck(await supabase.from('tujuan_pembelajaran').delete().eq('id', id));
                  await syncAllDataFromSupabase();
                }
                showToast('Tujuan Pembelajaran dihapus.', 'info');
                renderTPPage(container);
                if (window.lucide) window.lucide.createIcons();
              } catch (err) {
                showToast('Gagal menghapus TP: ' + err.message, 'error');
              }
            }
          );
        };
      });
    }

    // =========================================================================
    // 4. HALAMAN INPUT NILAI RAPOR & AUTO-GENERATE DESKRIPSI
    // =========================================================================
    function renderInputNilaiPage(container) {
      const kelasId = state.selectedKelasId || (state.kelasList[0]?.id || '');
      const mapelId = state.selectedMapelId || (state.mapelList[0]?.id || '');
      const klsObj = state.kelasList.find(k => k.id === kelasId);
      const tingkat = klsObj ? Number(klsObj.tingkat) : 6;

      const siswaKelas = state.siswaList.filter(s => s.kelas_id === kelasId);
      const tpAktif = state.tpList.filter(t => t.mapel_id === mapelId && Number(t.tingkat) === tingkat && String(t.semester) === String(state.selectedSemester) && t.status === 'Aktif');

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-lg font-extrabold text-slate-800">Input Nilai Akhir Rapor Siswa</h2>
              <p class="text-xs text-slate-500">Isi nilai rapor (0–100) dan centang ketercapaian TP untuk membuat deskripsi rapor otomatis.</p>
            </div>
            <button type="button" id="btn-switch-nilai-mode" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
              <i data-lucide="${state.nilaiEditMode === 'tp' ? 'file-text' : 'check-square'}" class="w-4 h-4"></i>
              <span>${state.nilaiEditMode === 'tp' ? 'Lihat dan Edit Deskripsi' : 'Lihat dan Edit Ketercapaian TP'}</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 text-xs">
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Kelas / Rombel</label>
              <select id="nilai-kelas-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                ${state.kelasList.map(k => `<option value="${k.id}" ${k.id === kelasId ? 'selected' : ''}>${esc(k.nama_kelas)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Mata Pelajaran</label>
              <select id="nilai-mapel-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                ${state.mapelList.map(m => `<option value="${m.id}" ${m.id === mapelId ? 'selected' : ''}>${esc(m.nama_mapel)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Semester</label>
              <select id="nilai-smt-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800">
                <option value="1" ${state.selectedSemester === '1' ? 'selected' : ''}>Semester 1</option>
                <option value="2" ${state.selectedSemester === '2' ? 'selected' : ''}>Semester 2</option>
              </select>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-blue-600 text-white">
                  <th class="py-3 px-3 font-bold w-10">No</th>
                  <th class="py-3 px-3 font-bold min-w-[160px]">Nama Siswa</th>
                  <th class="py-3 px-3 font-bold w-24 text-center">Nilai</th>
                  ${state.nilaiEditMode === 'tp' ? `
                    <th class="py-3 px-3 font-bold min-w-[240px]">TP yang Diukur & Tercapai Optimal</th>
                    <th class="py-3 px-3 font-bold min-w-[240px]">TP yang Diukur & Perlu Peningkatan</th>
                  ` : `
                    <th class="py-3 px-3 font-bold min-w-[260px]">Deskripsi Capaian Tertinggi</th>
                    <th class="py-3 px-3 font-bold min-w-[260px]">Deskripsi Capaian Terendah</th>
                  `}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${siswaKelas.length === 0 ? `
                  <tr><td colspan="5" class="py-8 text-center text-slate-400">Belum ada siswa pada kelas ini.</td></tr>
                ` : siswaKelas.map((s, idx) => {
                  const existing = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === mapelId && String(n.semester) === String(state.selectedSemester)) || {
                    nilai_akhir: '', tp_optimal_ids: [], tp_peningkatan_ids: [], deskripsi_tertinggi: '', deskripsi_terendah: ''
                  };
                  const optIds = Array.isArray(existing.tp_optimal_ids) ? existing.tp_optimal_ids : [];
                  const penIds = Array.isArray(existing.tp_peningkatan_ids) ? existing.tp_peningkatan_ids : [];

                  return `
                    <tr class="align-top hover:bg-blue-50/30" data-siswa-nilai-row="${s.id}">
                      <td class="py-3 px-3 font-bold text-slate-500">${idx + 1}</td>
                      <td class="py-3 px-3">
                        <div class="font-bold text-slate-800">${esc(s.nama_siswa)}</div>
                        <div class="text-[11px] text-slate-400">${esc(s.nisn)} / ${esc(s.nis)}</div>
                      </td>
                      <td class="py-3 px-3 text-center">
                        <input type="number" min="0" max="100" value="${existing.nilai_akhir}" placeholder="0-100"

                        <td class="py-3 px-3 space-y-1.5">
