                              <input type="checkbox" value="${tp.id}" ${optIds.includes(tp.id) ? 'checked' : ''} class="chk-tp-opt mt-0.5 rounded text-blue-600" />
                              <span class="text-[11px] text-slate-700 leading-snug">${esc(tp.deskripsi_tp)}</span>
                            </label>
                          `).join('')}
                        </td>
                        <td class="py-3 px-3 space-y-1.5">
                          ${tpAktif.length === 0 ? `<span class="text-slate-400 italic">-</span>` : tpAktif.map(tp => `
                            <label class="flex items-start gap-2 cursor-pointer p-1 rounded hover:bg-amber-50">
                              <input type="checkbox" value="${tp.id}" ${penIds.includes(tp.id) ? 'checked' : ''} class="chk-tp-pen mt-0.5 rounded text-amber-600" />
                              <span class="text-[11px] text-slate-700 leading-snug">${esc(tp.deskripsi_tp)}</span>
                            </label>
                          `).join('')}
                        </td>
                      ` : `
                        <td class="py-3 px-3">
                          <textarea rows="3" class="txt-desc-tinggi w-full border border-slate-300 rounded-xl p-2.5 text-[11px] leading-relaxed focus:ring-2 focus:ring-blue-500 outline-none">${esc(existing.deskripsi_tertinggi)}</textarea>
                        </td>
                        <td class="py-3 px-3">
                          <textarea rows="3" class="txt-desc-rendah w-full border border-slate-300 rounded-xl p-2.5 text-[11px] leading-relaxed focus:ring-2 focus:ring-amber-500 outline-none">${esc(existing.deskripsi_terendah)}</textarea>
                        </td>
                      `}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          ${siswaKelas.length > 0 ? `
            <div class="flex justify-end">
              <button type="button" id="btn-simpan-nilai-rapor" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm transition">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Simpan Data Nilai</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('nilai-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderInputNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('nilai-mapel-sel').onchange = (e) => { state.selectedMapelId = e.target.value; renderInputNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('nilai-smt-sel').onchange = (e) => { state.selectedSemester = e.target.value; renderInputNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.getElementById('btn-switch-nilai-mode').onclick = () => {
        state.nilaiEditMode = state.nilaiEditMode === 'tp' ? 'deskripsi' : 'tp';
        renderInputNilaiPage(container);
        if (window.lucide) window.lucide.createIcons();
      };

      const btnSave = document.getElementById('btn-simpan-nilai-rapor');
      if (btnSave) {
        btnSave.onclick = async () => {
          const rows = document.querySelectorAll('[data-siswa-nilai-row]');
          btnSave.disabled = true;
          try {
            for (const row of rows) {
              const siswaId = row.getAttribute('data-siswa-nilai-row');
              const nilaiVal = row.querySelector('.inp-nilai-akhir').value;
              if (nilaiVal === '') continue;

              const nilaiNum = Math.min(100, Math.max(0, Number(nilaiVal)));
              const existingIdx = state.nilaiRaporList.findIndex(n => n.siswa_id === siswaId && n.mapel_id === mapelId && String(n.semester) === String(state.selectedSemester) && tahunMatch(n));
              const prev = existingIdx >= 0 ? state.nilaiRaporList[existingIdx] : {};

              let tpOptimalIds = prev.tp_optimal_ids || [];
              let tpPeningkatanIds = prev.tp_peningkatan_ids || [];
              let descTinggi = prev.deskripsi_tertinggi || '';
              let descRendah = prev.deskripsi_terendah || '';

              if (state.nilaiEditMode === 'tp') {
                tpOptimalIds = Array.from(row.querySelectorAll('.chk-tp-opt:checked')).map(c => c.value);
                tpPeningkatanIds = Array.from(row.querySelectorAll('.chk-tp-pen:checked')).map(c => c.value);

                const optTexts = tpOptimalIds.map(id => tpAktif.find(t => t.id === id)?.deskripsi_tp).filter(Boolean);
                const penTexts = tpPeningkatanIds.map(id => tpAktif.find(t => t.id === id)?.deskripsi_tp).filter(Boolean);

                descTinggi = optTexts.length > 0
                  ? `Mencapai kompetensi dengan sangat baik dalam hal ${optTexts.join(', ')}.`
                  : `Menunjukkan penguasaan materi pelajaran dengan baik.`;
                descRendah = penTexts.length > 0
                  ? `Perlu peningkatan dalam hal ${penTexts.join(', ')}.`
                  : '';
              } else {
                descTinggi = row.querySelector('.txt-desc-tinggi').value.trim();
                descRendah = row.querySelector('.txt-desc-rendah').value.trim();
              }

              const payload = {
                siswa_id: siswaId,
                mapel_id: mapelId,
                kelas_id: kelasId,
                semester: String(state.selectedSemester),
                tahun_ajaran: state.sekolah.tahun_ajaran,
                nilai_akhir: nilaiNum,
                tp_optimal_ids: tpOptimalIds,
                tp_peningkatan_ids: tpPeningkatanIds,
                deskripsi_tertinggi: descTinggi,
                deskripsi_terendah: descRendah
              };

              if (IS_PREVIEW) {
                if (existingIdx >= 0) state.nilaiRaporList[existingIdx] = { ...prev, ...payload };
                else state.nilaiRaporList.push({ id: 'nr-' + Date.now() + Math.random(), ...payload });
              } else {
                if (existingIdx >= 0) {
                  sbCheck(await supabase.from('nilai_rapor').update(payload).eq('id', prev.id));
                } else {
                  sbCheck(await supabase.from('nilai_rapor').insert([payload]));
                }
              }
            }
            if (!IS_PREVIEW) await syncAllDataFromSupabase();
            showToast('Nilai rapor & deskripsi capaian kompetensi berhasil disimpan!', 'success');
            renderInputNilaiPage(container);
            if (window.lucide) window.lucide.createIcons();
          } catch (err) {
            showToast('Gagal menyimpan nilai: ' + err.message, 'error');
          } finally {
            btnSave.disabled = false;
          }
        };
      }
    }

    // =========================================================================
    // 5. HALAMAN IMPORT NILAI RAPOR (EXCEL .XLSX / .CSV)
    // =========================================================================
    function renderImportNilaiPage(container) {
      const kelasId = state.selectedKelasId || (state.kelasList[0]?.id || '');
      const mapelId = state.selectedMapelId || (state.mapelList[0]?.id || '');
      const mapelObj = state.mapelList.find(m => m.id === mapelId);
      const kelasObj = state.kelasList.find(k => k.id === kelasId);
      const siswaKelas = state.siswaList.filter(s => s.kelas_id === kelasId);

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-5">
          <div class="pb-3 border-b border-slate-100">
            <h2 class="text-lg font-extrabold text-slate-800">Import Nilai Akhir Rapor Siswa</h2>
            <p class="text-xs text-slate-500">Unduh format template Excel (.xlsx) kelas ini, isi nilai & deskripsi di Excel, lalu unggah kembali.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 text-xs">
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Kelas</label>
              <select id="imp-kelas" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                ${state.kelasList.map(k => `<option value="${k.id}" ${k.id === kelasId ? 'selected' : ''}>${esc(k.nama_kelas)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Mapel</label>
              <select id="imp-mapel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                ${state.mapelList.map(m => `<option value="${m.id}" ${m.id === mapelId ? 'selected' : ''}>${esc(m.nama_mapel)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Semester</label>
              <select id="imp-semester" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                <option value="1" ${state.selectedSemester === '1' ? 'selected' : ''}>Semester 1</option>
                <option value="2" ${state.selectedSemester === '2' ? 'selected' : ''}>Semester 2</option>
              </select>
            </div>
          </div>

          <div class="rounded-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-100 px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b border-slate-200">
              <span class="font-extrabold text-xs sm:text-sm text-slate-800 flex items-center gap-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-blue-700"></i>
                <span>Import Nilai Rapor</span>
              </span>
              <button type="button" id="btn-download-template-nilai" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>Download Format Nilai ${esc(mapelObj?.kode_mapel || '')} (.xlsx)</span>
              </button>
            </div>

            <div class="p-5 space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-2">Pilih File Nilai (Format .XLSX atau .CSV dari Template)</label>
                <input type="file" id="file-import-nilai" accept=".xlsx,.xls,.csv" class="block w-full text-xs text-slate-600 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-slate-300 rounded-xl p-1.5" />
              </div>

              <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900">
                <strong>Catatan Penting:</strong> Jangan mengubah kolom NISN/NIS pada file template. Nilai diisi angka 0–100 tanpa rumus Excel.
              </div>

              <div class="flex justify-end">
                <button type="button" id="btn-proses-import-nilai" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm transition">
                  <i data-lucide="upload" class="w-4 h-4"></i>
                  <span>Import Nilai Sekarang</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('imp-kelas').onchange = (e) => { state.selectedKelasId = e.target.value; renderImportNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('imp-mapel').onchange = (e) => { state.selectedMapelId = e.target.value; renderImportNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('imp-semester').onchange = (e) => { state.selectedSemester = e.target.value; renderImportNilaiPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.getElementById('btn-download-template-nilai').onclick = () => {
        const rows = siswaKelas.map((s, idx) => {
          const ex = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === mapelId && String(n.semester) === String(state.selectedSemester));
          return {
            'No': idx + 1,
            'NISN': s.nisn,
            'NIS': s.nis,
            'Nama Siswa': s.nama_siswa,
            'Nilai (0-100)': ex?.nilai_akhir ?? '',
            'Capaian Tertinggi': ex?.deskripsi_tertinggi || '',
            'Capaian Terendah': ex?.deskripsi_terendah || ''
          };
        });
        exportStyledExcel(
          rows.length > 0 ? rows : [{ 'No': 1, 'NISN': '', 'NIS': '', 'Nama Siswa': '', 'Nilai (0-100)': '', 'Capaian Tertinggi': '', 'Capaian Terendah': '' }],
          `NIL_RAPOR_${mapelObj?.kode_mapel || 'MAPEL'}_${kelasObj?.nama_kelas || 'SD'}_Smt${state.selectedSemester}.xlsx`,
          'Format Nilai Rapor',
          [6, 16, 14, 30, 14, 42, 42]
        );
        showToast('Format template Excel nilai berhasil diunduh!', 'success');
      };

      document.getElementById('btn-proses-import-nilai').onclick = () => {
        const fileInput = document.getElementById('file-import-nilai');
        if (!fileInput.files || fileInput.files.length === 0) {
          showToast('Silakan pilih file Excel/CSV terlebih dahulu!', 'error');
          return;
        }
        if (!window.XLSX) {
          showToast('Library pembaca Excel sedang dimuat, coba sesaat lagi.', 'info');
          return;
        }
        const btnImp = document.getElementById('btn-proses-import-nilai');
        btnImp.disabled = true;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = new Uint8Array(ev.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });

            let importedCount = 0;
            for (let i = 0; i < rows.length; i++) {
              const r = rows[i];
              const nisn = String(r['NISN'] || '').trim();
              const valRaw = r['Nilai (0-100)'] !== undefined && r['Nilai (0-100)'] !== '' ? r['Nilai (0-100)'] : r['NILAI'];
              const nilaiNum = parseInt(valRaw, 10);
              if (!nisn || isNaN(nilaiNum)) continue;

              const siswa = siswaKelas.find(s => String(s.nisn).trim() === nisn);
              if (!siswa) continue;

              const payload = {
                siswa_id: siswa.id,
                mapel_id: mapelId,
                kelas_id: kelasId,
                semester: String(state.selectedSemester),
                tahun_ajaran: state.sekolah.tahun_ajaran,
                nilai_akhir: Math.min(100, Math.max(0, nilaiNum)),
                tp_optimal_ids: [],
                tp_peningkatan_ids: [],
                deskripsi_tertinggi: String(r['Capaian Tertinggi'] || r['CAPAIAN_TERTINGGI'] || '').trim() || 'Mencapai kompetensi mata pelajaran dengan sangat baik.',
                deskripsi_terendah: String(r['Capaian Terendah'] || r['CAPAIAN_TERENDAH'] || '').trim()
              };

              const exIdx = state.nilaiRaporList.findIndex(n => n.siswa_id === siswa.id && n.mapel_id === mapelId && String(n.semester) === String(state.selectedSemester) && tahunMatch(n));
              if (IS_PREVIEW) {
                if (exIdx >= 0) state.nilaiRaporList[exIdx] = { ...state.nilaiRaporList[exIdx], ...payload };
                else state.nilaiRaporList.push({ id: 'nr-' + Date.now() + i, ...payload });
              } else {
                if (exIdx >= 0) sbCheck(await supabase.from('nilai_rapor').update(payload).eq('id', state.nilaiRaporList[exIdx].id));
                else sbCheck(await supabase.from('nilai_rapor').insert([payload]));
              }
              importedCount++;
            }
            if (!IS_PREVIEW) await syncAllDataFromSupabase();
            showToast(`Berhasil mengimport ${importedCount} data nilai rapor!`, 'success');
          } catch (err) {
            showToast('Gagal memproses file Excel: ' + err.message, 'error');
          } finally {
            btnImp.disabled = false;
          }
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
      };
    }

    // =========================================================================
    // 6. HALAMAN CEK PENILAIAN (STATUS PENILAIAN & CAPAIAN NILAI RAPOR)
    // =========================================================================
    function renderCekPenilaianPage(container) {
      const kelasId = state.selectedKelasId || (state.kelasList[0]?.id || '');
      const klsObj = state.kelasList.find(k => k.id === kelasId);
      const siswaKelas = state.siswaList.filter(s => s.kelas_id === kelasId);

      container.innerHTML = `
        <div class="space-y-5">
          <!-- Kartu 1: Status Penilaian Per Mapel -->
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div>
                <h2 class="text-lg font-extrabold text-slate-800">Status Penilaian & Ketuntasan Rapor</h2>
                <p class="text-xs text-slate-500">Pantau kelengkapan nilai & deskripsi per mata pelajaran serta rekap capaian siswa.</p>
              </div>
              <select id="cek-kelas-sel" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">
                ${state.kelasList.map(k => `<option value="${k.id}" ${k.id === kelasId ? 'selected' : ''}>${esc(k.nama_kelas)}</option>`).join('')}
              </select>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-200">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-blue-600 text-white">
                    <th class="py-2.5 px-3 font-bold w-12">No</th>
                    <th class="py-2.5 px-3 font-bold">Nama Mata Pelajaran</th>
                    <th class="py-2.5 px-3 font-bold">Rombel</th>
                    <th class="py-2.5 px-3 font-bold text-center">Nilai Rapor</th>
                    <th class="py-2.5 px-3 font-bold text-center">Deskripsi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${state.mapelList.map((m, idx) => {
                    const mapelNilai = state.nilaiRaporList.filter(n => n.kelas_id === kelasId && n.mapel_id === m.id && String(n.semester) === String(state.selectedSemester) && tahunMatch(n));
                    const nCount = mapelNilai.length;
                    const dCount = mapelNilai.filter(n => (n.deskripsi_tertinggi || '').trim().length > 0).length;
                    const isNilaiComplete = siswaKelas.length > 0 && nCount >= siswaKelas.length;
                    const isDescComplete = siswaKelas.length > 0 && dCount >= siswaKelas.length;
                    const nilaiBadge = nCount > 0 ? (isNilaiComplete ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white') : 'bg-rose-600 text-white';
                    const descBadge = dCount > 0 ? (isDescComplete ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white') : 'bg-rose-600 text-white';

                    return `
                      <tr>
                        <td class="py-2.5 px-3 font-bold text-slate-500">${idx + 1}</td>
                        <td class="py-2.5 px-3 font-bold text-slate-800">${esc(m.nama_mapel)}</td>
                        <td class="py-2.5 px-3 font-semibold">${esc(klsObj?.nama_kelas || '-')}</td>
                        <td class="py-2.5 px-3 text-center"><span class="px-3 py-1 rounded-lg font-bold inline-block min-w-[85px] ${nilaiBadge}">${nCount} / ${siswaKelas.length} Data</span></td>
                        <td class="py-2.5 px-3 text-center"><span class="px-3 py-1 rounded-lg font-bold inline-block min-w-[85px] ${descBadge}">${dCount} / ${siswaKelas.length} Data</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Kartu 2: Ketuntasan & Rincian Capaian Per Siswa -->
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
            <h3 class="text-base font-extrabold text-slate-800">Ketuntasan Nilai & Deskripsi Rapor Siswa</h3>
            <div class="overflow-x-auto rounded-xl border border-slate-200">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-blue-600 text-white">
                    <th class="py-2.5 px-3 font-bold w-12">No</th>
                    <th class="py-2.5 px-3 font-bold">Nama Siswa</th>
                    <th class="py-2.5 px-3 font-bold">NISN / NIS</th>
                    <th class="py-2.5 px-3 font-bold text-center">Rata-Rata</th>
                    <th class="py-2.5 px-3 font-bold text-center">Capaian Rapor</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${siswaKelas.map((s, idx) => {
                    const listN = state.nilaiRaporList.filter(n => n.siswa_id === s.id && String(n.semester) === String(state.selectedSemester));
                    const avg = listN.length > 0 ? (listN.reduce((a, b) => a + Number(b.nilai_akhir), 0) / listN.length).toFixed(1) : '-';
                    return `
                      <tr class="hover:bg-slate-50">
                        <td class="py-2.5 px-3 font-bold text-slate-500">${idx + 1}</td>
                        <td class="py-2.5 px-3 font-bold text-slate-800">${esc(s.nama_siswa)}</td>
                        <td class="py-2.5 px-3 text-slate-500">${esc(s.nisn)} / ${esc(s.nis)}</td>
                        <td class="py-2.5 px-3 text-center font-extrabold text-blue-700">${avg}</td>
                        <td class="py-2.5 px-3 text-center">
                          <div class="flex items-center justify-center gap-2">
                            <button type="button" data-cek-nilai-siswa="${s.id}" class="btn-cek-nilai-siswa bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-300 px-2.5 py-1 rounded-lg font-bold">
                              Cek Capaian Nilai
                            </button>
                            <button type="button" data-cek-desc-siswa="${s.id}" class="btn-cek-desc-siswa bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded-lg font-bold">
                              Cek Deskripsi
                            </button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('cek-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderCekPenilaianPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.querySelectorAll('.btn-cek-nilai-siswa').forEach(btn => {
        btn.onclick = () => {
          const s = state.siswaList.find(item => item.id === btn.getAttribute('data-cek-nilai-siswa'));
          if (!s) return;
          openModal(`Daftar Capaian Nilai Rapor - ${s.nama_siswa}`, `
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-blue-600 text-white">
                  <th class="py-2 px-3">No</th>
                  <th class="py-2 px-3">Mata Pelajaran</th>
                  <th class="py-2 px-3 text-center">Smt 1</th>
                  <th class="py-2 px-3 text-center">Smt 2</th>
                  <th class="py-2 px-3 text-center">Rata-Rata</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${state.mapelList.map((m, i) => {
                  const n1 = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === m.id && String(n.semester) === '1')?.nilai_akhir;
                  const n2 = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === m.id && String(n.semester) === '2')?.nilai_akhir;
                  const valid = [n1, n2].filter(v => v !== undefined && v !== null);
                  const rata = valid.length > 0 ? Math.round(valid.reduce((a, b) => a + Number(b), 0) / valid.length) : '-';
                  return `
                    <tr>
                      <td class="py-2 px-3">${i + 1}</td>
                      <td class="py-2 px-3 font-bold">${esc(m.nama_mapel)}</td>
                      <td class="py-2 px-3 text-center">${n1 ?? '-'}</td>
                      <td class="py-2 px-3 text-center">${n2 ?? '-'}</td>
                      <td class="py-2 px-3 text-center font-bold text-blue-700">${rata}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `, 'max-w-xl');
        };
      });

      document.querySelectorAll('.btn-cek-desc-siswa').forEach(btn => {
        btn.onclick = () => {

            <div class="space-y-2.5 text-xs">

                const nr = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === m.id && String(n.semester) === String(state.selectedSemester));
                return `
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div class="font-extrabold text-blue-900 mb-1">${esc(m.nama_mapel)} (Nilai: ${nr?.nilai_akhir ?? '-'})</div>
                    <p class="text-slate-700 leading-relaxed">${esc(nr?.deskripsi_tertinggi || 'Belum ada deskripsi.')} ${esc(nr?.deskripsi_terendah || '')}</p>
                  </div>

    // =========================================================================
    // 7. HALAMAN NILAI KARAKTER PROFIL PELAJAR PANCASILA (P3)
    // =========================================================================
    function renderNilaiKarakterPage(container) {
      const kelasId = state.selectedKelasId || (state.kelasList[0]?.id || '');
      const siswaKelas = state.siswaList.filter(s => s.kelas_id === kelasId);

          <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-lg font-extrabold text-slate-800">Input Nilai Karakter Profil Pelajar Pancasila (P3)</h2>
              <p class="text-xs text-slate-500">Observasi perkembangan karakter 6 Dimensi Profil Pelajar Pancasila peserta didik SD.</p>
            </div>
            <button type="button" id="btn-apply-all-p3" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
              <i data-lucide="copy-check" class="w-4 h-4"></i>
              <span>Terapkan "Berkembang Sesuai Harapan" ke Semua</span>

            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Kelas</label>
              <select id="p3-kelas-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                ${state.kelasList.map(k => `<option value="${k.id}" ${k.id === kelasId ? 'selected' : ''}>${esc(k.nama_kelas)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Semester</label>
              <select id="p3-smt-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                <option value="1" ${state.selectedSemester === '1' ? 'selected' : ''}>Semester 1</option>
                <option value="2" ${state.selectedSemester === '2' ? 'selected' : ''}>Semester 2</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">Pilih Dimensi P3</label>
              <select id="p3-dimensi-sel" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 font-bold">
                ${DIMENSI_P3_LIST.map(d => `<option value="${d.id}" ${d.id === dimObj.id ? 'selected' : ''}>${esc(d.nama)}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-blue-600 text-white">
                  <th class="py-2.5 px-3 font-bold w-10">No</th>
                  <th class="py-2.5 px-3 font-bold min-w-[160px]">Nama Siswa</th>
                  ${dimObj.elemen.map(el => `<th class="py-2.5 px-3 font-bold min-w-[155px]">${esc(el)}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${siswaKelas.length === 0 ? `
                  <tr><td colspan="${dimObj.elemen.length + 2}" class="py-8 text-center text-slate-400">Belum ada siswa di kelas ini.</td></tr>
                ` : siswaKelas.map((s, idx) => {
                  const rec = state.nilaiP3List.find(p => p.siswa_id === s.id && p.dimensi === dimObj.nama && String(p.semester) === String(state.selectedSemester));
                  const elMap = (rec && typeof rec.elemen_capaian === 'object') ? rec.elemen_capaian : {};
                  return `
                    <tr class="hover:bg-slate-50" data-p3-siswa="${s.id}">
                      <td class="py-2.5 px-3 font-bold text-slate-500">${idx + 1}</td>
                      <td class="py-2.5 px-3">
                        <div class="font-bold text-slate-800">${esc(s.nama_siswa)}</div>
                        <div class="text-[10px] text-slate-400">NISN: ${esc(s.nisn)}</div>
                      </td>
                      ${dimObj.elemen.map(el => `
                        <td class="py-2.5 px-3">
                          <select data-elemen="${esc(el)}" class="p3-elemen-sel w-full border border-slate-300 rounded-xl px-2 py-1.5 text-[11px] bg-white">
                            ${PREDIKAT_P3_OPTIONS.map(opt => `<option value="${opt}" ${(elMap[el] || 'Tidak Teramati') === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                          </select>
                        </td>
                      `).join('')}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          ${siswaKelas.length > 0 ? `
            <div class="flex justify-end">
              <button type="button" id="btn-simpan-p3" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Simpan & Generate Deskripsi Karakter P3</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('p3-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderNilaiKarakterPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('p3-smt-sel').onchange = (e) => { state.selectedSemester = e.target.value; renderNilaiKarakterPage(container); if (window.lucide) window.lucide.createIcons(); };
      document.getElementById('p3-dimensi-sel').onchange = (e) => { state.selectedDimensiId = e.target.value; renderNilaiKarakterPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.getElementById('btn-apply-all-p3').onclick = () => {
        document.querySelectorAll('.p3-elemen-sel').forEach(sel => { sel.value = 'Berkembang Sesuai Harapan'; });
        showToast('Seluruh indikator diatur ke Berkembang Sesuai Harapan. Klik Simpan untuk merekam.', 'info');
      };

      const btnSimpanP3 = document.getElementById('btn-simpan-p3');
      if (btnSimpanP3) {
        btnSimpanP3.onclick = async () => {
          const rows = document.querySelectorAll('[data-p3-siswa]');
          btnSimpanP3.disabled = true;
          try {
            for (const row of rows) {
              const siswaId = row.getAttribute('data-p3-siswa');
              const sObj = siswaKelas.find(s => s.id === siswaId);
              const elemenCapaian = {};
              const aktifList = [];

              row.querySelectorAll('.p3-elemen-sel').forEach(sel => {
                const elName = sel.getAttribute('data-elemen');
                elemenCapaian[elName] = sel.value;
                if (sel.value !== 'Tidak Teramati') {
                  aktifList.push(`${sel.value.toLowerCase()} dalam elemen ${elName.toLowerCase()}`);
                }
              });

              const deskripsi = aktifList.length > 0
                ? `Dalam penguatan dimensi ${dimObj.nama.toLowerCase()}, ${sObj?.nama_siswa || 'peserta didik'} menunjukkan ${aktifList.join(', ')}.`
                : `Dalam penguatan dimensi ${dimObj.nama.toLowerCase()}, ${sObj?.nama_siswa || 'peserta didik'} berkembang sesuai harapan pada kegiatan pembelajaran.`;

              const payload = {
                siswa_id: siswaId,
                kelas_id: kelasId,
                semester: String(state.selectedSemester),
                tahun_ajaran: state.sekolah.tahun_ajaran,
                dimensi: dimObj.nama,
                elemen_capaian: elemenCapaian,
                deskripsi_karakter: deskripsi
              };

              const exIdx = state.nilaiP3List.findIndex(p => p.siswa_id === siswaId && p.dimensi === dimObj.nama && String(p.semester) === String(state.selectedSemester) && tahunMatch(p));
              if (IS_PREVIEW) {
                if (exIdx >= 0) state.nilaiP3List[exIdx] = { ...state.nilaiP3List[exIdx], ...payload };
                else state.nilaiP3List.push({ id: 'p3-' + Date.now() + Math.random(), ...payload });
              } else {
                if (exIdx >= 0) sbCheck(await supabase.from('nilai_karakter_p3').update(payload).eq('id', state.nilaiP3List[exIdx].id));
                else sbCheck(await supabase.from('nilai_karakter_p3').insert([payload]));
              }
            }
            if (!IS_PREVIEW) await syncAllDataFromSupabase();
            showToast('Nilai Karakter Profil Pelajar Pancasila berhasil disimpan!', 'success');
          } catch (err) {
            showToast('Gagal menyimpan nilai karakter P3: ' + err.message, 'error');
          } finally {
            btnSimpanP3.disabled = false;
          }
        };
      }
    }

    // =========================================================================
    // 8. HALAMAN KEGIATAN EKSTRAKURIKULER SD
    // =========================================================================
    function renderEkskulPage(container) {

      const siswaKelas = state.siswaList.filter(s => s.kelas_id === kelasId);

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-lg font-extrabold text-slate-800">Input Nilai Ekstrakurikuler SD</h2>
              <p class="text-xs text-slate-500">Pramuka Wajib, Drumband, Seni Tari, Tahfidz, Pencak Silat, UKS/Dokter Kecil, dll.</p>

            <div class="flex items-center gap-2">
              <select id="eks-kelas-sel" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">

              <button type="button" id="btn-tambah-ekskul" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">

                <span>+ Tambah Nilai Ekskul</span>

                  <th class="py-2.5 px-3 font-bold w-10">No</th>
                  <th class="py-2.5 px-3 font-bold">Nama Siswa</th>
                  <th class="py-2.5 px-3 font-bold">Kegiatan Ekskul</th>

                  <th class="py-2.5 px-3 font-bold">Deskripsi Capaian</th>

                  <tr><td colspan="6" class="py-8 text-center text-slate-400">Belum ada data nilai ekstrakurikuler di kelas ini.</td></tr>
                ` : ekskulFiltered.map((ek, idx) => {
                  const s = state.siswaList.find(item => item.id === ek.siswa_id);
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2.5 px-3 font-bold text-slate-500">${idx + 1}</td>
                      <td class="py-2.5 px-3 font-bold text-slate-800">${esc(s?.nama_siswa || '-')}</td>
                      <td class="py-2.5 px-3 font-semibold text-blue-700">${esc(ek.nama_ekskul)}</td>
                      <td class="py-2.5 px-3 text-center"><span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full">${esc(ek.predikat)}</span></td>
                      <td class="py-2.5 px-3 text-slate-600">${esc(ek.deskripsi)}</td>
                      <td class="py-2.5 px-3 text-center">
                        <button type="button" data-del-ekskul="${ek.id}" class="btn-del-ekskul bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2.5 py-1 rounded-lg font-bold">

                        </button>
                      </td>
                    </tr>
                  `;

              </tbody>
            </table>
          </div>

      `;

      document.getElementById('eks-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderEkskulPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.getElementById('btn-tambah-ekskul').onclick = () => {
        if (siswaKelas.length === 0) {
          showToast('Tidak ada siswa di kelas ini.', 'error');
          return;
        }
        openModal('Tambah Nilai Ekstrakurikuler SD', `
          <form id="form-add-ekskul" class="space-y-3.5 text-xs">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Pilih Siswa *</label>
              <select name="siswa_id" required class="w-full border border-slate-300 rounded-xl px-3 py-2 font-bold">
                ${siswaKelas.map(s => `<option value="${s.id}">${esc(s.nama_siswa)} (${esc(s.nis)})</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="font-bold text-slate-700 block mb-1">Nama Ekstrakurikuler *</label>
                <input type="text" name="nama_ekskul" required value="Pramuka Siaga / Penggalang" class="w-full border border-slate-300 rounded-xl px-3 py-2" />
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-1">Predikat Nilai *</label>
                <select name="predikat" class="w-full border border-slate-300 rounded-xl px-3 py-2 font-bold">
                  <option value="Sangat Baik">Sangat Baik</option>
                  <option value="Baik">Baik</option>
                  <option value="Cukup">Cukup</option>
                </select>
              </div>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Deskripsi Ketercapaian *</label>
              <textarea name="deskripsi" rows="3" required placeholder="Contoh: Ananda sangat aktif mengikuti latihan kepramukaan dan menunjukkan sikap disiplin serta kerja sama tim." class="w-full border border-slate-300 rounded-xl p-3"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
              <button type="button" onclick="document.getElementById('close-modal-btn').click()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Simpan Nilai Ekskul</button>
            </div>
          </form>
        `, 'max-w-lg');

        document.getElementById('form-add-ekskul').onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = {
            siswa_id: fd.get('siswa_id'),
            kelas_id: kelasId,
            semester: String(state.selectedSemester),
            tahun_ajaran: state.sekolah.tahun_ajaran,
            nama_ekskul: fd.get('nama_ekskul').trim(),
            predikat: fd.get('predikat'),
            deskripsi: fd.get('deskripsi').trim()
          };
          try {
            if (IS_PREVIEW) {
              state.nilaiEkskulList.push({ id: 'eks-' + Date.now(), ...payload });
            } else {
              const { error } = await supabase.from('nilai_ekskul').insert([payload]);
              if (error) throw error;
              await syncAllDataFromSupabase();
            }
            closeModal();
            showToast('Nilai ekstrakurikuler berhasil disimpan!', 'success');
            renderEkskulPage(container);
            if (window.lucide) window.lucide.createIcons();
          } catch (err) {
            showToast('Gagal menyimpan nilai ekskul: ' + err.message, 'error');
          }
        };
      };

      document.querySelectorAll('.btn-del-ekskul').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-del-ekskul');
          confirmAction(
            'Hapus Data Ekstrakurikuler',
            'Yakin ingin menghapus data nilai ekstrakurikuler ini?',
            async () => {
              try {
                if (IS_PREVIEW) {
                  state.nilaiEkskulList = state.nilaiEkskulList.filter(e => e.id !== id);
                } else {
                  sbCheck(await supabase.from('nilai_ekskul').delete().eq('id', id));
                  await syncAllDataFromSupabase();
                }
                showToast('Data ekstrakurikuler dihapus.', 'info');
                renderEkskulPage(container);
                if (window.lucide) window.lucide.createIcons();
              } catch (err) {
                showToast('Gagal menghapus data ekstrakurikuler: ' + err.message, 'error');
              }
            }
          );
        };
      });
    }

            <div class="flex justify-end">
              <button type="button" id="btn-simpan-walas" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Simpan Data Wali Kelas</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('walas-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderDataWalasPage(container); if (window.lucide) window.lucide.createIcons(); };

      const btnSave = document.getElementById('btn-simpan-walas');
      if (btnSave) {
        btnSave.onclick = async () => {
          const rows = document.querySelectorAll('[data-walas-siswa]');
          btnSave.disabled = true;
          try {
            for (const row of rows) {
              const siswaId = row.getAttribute('data-walas-siswa');
              const payload = {
                siswa_id: siswaId,
                kelas_id: kelasId,
                semester: String(state.selectedSemester),
                tahun_ajaran: state.sekolah.tahun_ajaran,
                sakit: Number(row.querySelector('.w-sakit').value || 0),
                izin: Number(row.querySelector('.w-izin').value || 0),
                tanpa_keterangan: Number(row.querySelector('.w-alpa').value || 0),
                catatan_walas: row.querySelector('.w-catatan').value.trim(),
                status_kenaikan: row.querySelector('.w-kenaikan').value.trim()
              };

              const exIdx = state.dataWaliList.findIndex(d => d.siswa_id === siswaId && String(d.semester) === String(state.selectedSemester) && tahunMatch(d));
              if (IS_PREVIEW) {
                if (exIdx >= 0) state.dataWaliList[exIdx] = { ...state.dataWaliList[exIdx], ...payload };
                else state.dataWaliList.push({ id: 'dw-' + Date.now() + Math.random(), ...payload });
              } else {
                if (exIdx >= 0) sbCheck(await supabase.from('data_wali_kelas').update(payload).eq('id', state.dataWaliList[exIdx].id));
                else sbCheck(await supabase.from('data_wali_kelas').insert([payload]));
              }
            }
            if (!IS_PREVIEW) await syncAllDataFromSupabase();
            showToast('Data kehadiran dan catatan wali kelas berhasil disimpan!', 'success');
          } catch (err) {
            showToast('Gagal menyimpan data wali kelas: ' + err.message, 'error');
          } finally {
            btnSave.disabled = false;
          }
        };
      }
    }

        state.printConfig = {
          ukuran: document.getElementById('pc-ukuran').value,
          marginKiri: Number(document.getElementById('pc-kiri').value || 20),
          marginKanan: Number(document.getElementById('pc-kanan').value || 20),
          marginAtas: Number(document.getElementById('pc-atas').value || 12),
          marginBawah: Number(document.getElementById('pc-bawah').value || 15),
          tandaTangan: document.getElementById('pc-ttd').value === 'true'
        };
      };

      document.getElementById('cetak-kelas-sel').onchange = (e) => { state.selectedKelasId = e.target.value; renderCetakRaporPage(container); if (window.lucide) window.lucide.createIcons(); };

      document.getElementById('btn-download-leger').onclick = () => {
        const rows = siswaKelas.map((s, idx) => {
          let sum = 0, cnt = 0;
          const rowObj = {
            'No': idx + 1,
            'Nama Siswa': s.nama_siswa,
            'NISN': s.nisn,
            'NIS': s.nis
          };
          state.mapelList.forEach(m => {
            const nr = state.nilaiRaporList.find(n => n.siswa_id === s.id && n.mapel_id === m.id && String(n.semester) === String(state.selectedSemester));
            if (nr && typeof nr.nilai_akhir === 'number') {
              sum += nr.nilai_akhir;
              cnt++;
              rowObj[m.kode_mapel] = nr.nilai_akhir;
            } else {
              rowObj[m.kode_mapel] = '-';
            }
          });
          const dw = state.dataWaliList.find(d => d.siswa_id === s.id && String(d.semester) === String(state.selectedSemester)) || { sakit: 0, izin: 0, tanpa_keterangan: 0 };

          rowObj['Izin'] = dw.izin;
          rowObj['Alpa'] = dw.tanpa_keterangan;
          return rowObj;

          rows.length > 0 ? rows : [{ 'No': 1, 'Nama Siswa': 'Belum ada data siswa' }],

          if (s) triggerPrintDocuments([s], 'rapor');

      document.getElementById('btn-cetak-semua-pelengkap').onclick = () => {
        syncPrintCfg();
        if (siswaKelas.length === 0) return;
        triggerPrintDocuments(siswaKelas, 'pelengkap');

      document.getElementById('btn-cetak-semua-rapor').onclick = () => {
        syncPrintCfg();

        triggerPrintDocuments(siswaKelas, 'rapor');

    // =========================================================================
    // UTILITAS EKSPOR EXCEL (.XLSX) RAPI
    // =========================================================================
    function exportStyledExcel(rowsArray, filename, sheetName = 'Data', colWidths = []) {
      if (!window.XLSX) {
        showToast('Library Excel sedang dimuat, silakan coba sesaat lagi.', 'info');
        return;
      }
      const ws = window.XLSX.utils.json_to_sheet(rowsArray);
      if (colWidths.length > 0) {
        ws['!cols'] = colWidths.map(w => ({ wch: w }));
      }
      const wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
      window.XLSX.writeFile(wb, filename);
    }

    // =========================================================================
    // INISIALISASI STARTUP & PEMULIHAN SESI MULTI-DEVICE
    // =========================================================================
    async function bootstrapApp() {
      try {
        if (!IS_PREVIEW && supabase) {
          const savedRaw = localStorage.getItem('erapor_sd_session');
          if (savedRaw) {
            const saved = JSON.parse(savedRaw);
            state.selectedSemester = saved.semester || '1';

            if (saved.roleType === 'admin') {
              const { data } = await supabase.auth.getSession();
              if (data?.session?.user) {
                state.currentUser = {
                  id: data.session.user.id,
                  roleType: 'admin',
                  nama: 'Administrator Sekolah',
                  nip: '-',
                  username: data.session.user.email,
                  jabatan: 'Admin / Operator Dapodik',
                  wali_kelas_id: ''
                };
                await syncAllDataFromSupabase();
                renderMainShell();
                return;
              }
            } else if (saved.roleType === 'guru' && saved.guruId) {
              const { data: gurus } = await supabase.from('guru_users').select('*').eq('id', saved.guruId).limit(1);
              if (gurus && gurus.length > 0) {
                const g = gurus[0];
                await syncAllDataFromSupabase();
                const parsed = parseGuruRoleAndSchool(g.role, state.sekolah.nama_sekolah);
                state.sekolah.nama_sekolah = parsed.namaSekolah;
                state.currentUser = {
                  id: g.id,
                  roleType: 'guru',
                  nama: g.nama_lengkap,
                  nip: g.nip || '-',
                  username: g.username,
                  jabatan: parsed.jabatan,
                  wali_kelas_id: g.wali_kelas_id || ''
                };
                renderMainShell();
                return;
              }
            }
          }
        }
      } catch (_) {}

      renderLoginScreen();
    }

    bootstrapApp();
